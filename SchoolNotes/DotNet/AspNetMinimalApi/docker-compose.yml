services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: schoolnotes
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    ports:
      - "5006:5000"
    environment:
      DB_DRIVER: pgsql
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: schoolnotes
      DB_USER: postgres
      DB_PASSWORD: postgres
      CACHE_TYPE: local
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      CORS_ORIGINS: ""
      RATE_LIMIT_MAX: "100"
      RATE_LIMIT_WINDOW: "60"
      JWT_SECRET: schoolnotes-production-jwt-secret-key-0123456789abcdef
      ADMIN_USERNAME: schoolnotes
      ADMIN_PASSWORD: schoolnotes
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
