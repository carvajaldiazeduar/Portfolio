services:
  localstack:
    image: localstack/localstack:3.1.0
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3,dynamodb,sqs,sns
      S3_ENDPOINT_STRATEGY: path
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: mock_key
      AWS_SECRET_ACCESS_KEY: mock_secret
      DEBUG: "0"
      EXTRA_CORS_ALLOWED_ORIGINS: "http://localhost:5006"
    volumes:
      - localstack-data:/var/lib/localstack
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 20

  pipeline:
    build: .
    image: streamvideo-dotnet
    environment:
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: mock_key
      AWS_SECRET_ACCESS_KEY: mock_secret
      INPUT_BUCKET: streamvideo-input
      OUTPUT_BUCKET: streamvideo-output
      JOBS_TABLE: streamvideo-jobs
      NOTIFY_QUEUE: streamvideo-notifications
      NOTIFY_TOPIC: streamvideo-notifications
      ANALYZER: local
      TRANSCODER: stub
    command: ["watch"]
    depends_on:
      localstack:
        condition: service_healthy
      web:
        condition: service_started

  web:
    image: python:3.12-slim
    ports:
      - "5006:5006"
    volumes:
      - ../..:/assets:ro
    command: ["python", "-m", "http.server", "5006", "--directory", "/assets/Web"]
    depends_on:
      localstack:
        condition: service_healthy
    logging:
      driver: none

volumes:
  localstack-data: