services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  data-pipeline:
    build: .
    ports:
      - "5000:5000"
    environment:
      - WAREHOUSE_DRIVER=${WAREHOUSE_DRIVER:-duckdb}
      - WAREHOUSE_PATH=${WAREHOUSE_PATH:-/app/data.duckdb}
      - CACHE_TYPE=${CACHE_TYPE:-local}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
    volumes:
      - dpdata:/app
    depends_on:
      - redis

volumes:
  dpdata:
