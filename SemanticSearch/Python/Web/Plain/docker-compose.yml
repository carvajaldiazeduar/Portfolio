version: "3.8"
services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  chroma:
    image: chromadb/chroma:latest
    ports:
      - "8000:8000"
    environment:
      - CHROMA_HOST=0.0.0.0
      - CHROMA_PORT=8000
    volumes:
      - chromadata:/chroma/chroma

  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      VECTOR_DRIVER: chromadb
      CHROMA_HOST: chroma
      CHROMA_PORT: "8000"
      VECTOR_COLLECTION: documents
      VECTOR_DIMENSION: "1536"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      CACHE_TTL: "300"
    depends_on:
      chroma:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  chromadata: