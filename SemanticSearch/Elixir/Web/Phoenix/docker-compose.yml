services:
  chroma:
    image: ghcr.io/chroma-core/chroma:latest
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8000/api/v2/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    ports:
      - "4000:4000"
    environment:
      VECTOR_DRIVER: ${VECTOR_DRIVER:-chromadb}
      VECTOR_DIMENSION: ${VECTOR_DIMENSION:-1536}
      VECTOR_COLLECTION: ${VECTOR_COLLECTION:-documents}
      CHROMA_URL: http://chroma:8000
      CACHE_TYPE: ${CACHE_TYPE:-redis}
      REDIS_HOST: ${REDIS_HOST:-redis:6379}
    depends_on:
      chroma:
        condition: service_healthy
      redis:
        condition: service_healthy
