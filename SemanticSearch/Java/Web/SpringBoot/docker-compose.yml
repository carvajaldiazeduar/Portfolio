services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  chroma:
    image: chromadb/chroma:0.5.20
    ports:
      - "8000:8000"

  semantic-search:
    build: .
    ports:
      - "5000:5000"
    environment:
      - VECTOR_DRIVER=${VECTOR_DRIVER:-chromadb}
      - VECTOR_DIMENSION=${VECTOR_DIMENSION:-1536}
      - VECTOR_COLLECTION=${VECTOR_COLLECTION:-documents}
      - CHROMA_URL=${CHROMA_URL:-http://chroma:8000}
      - CACHE_TYPE=${CACHE_TYPE:-local}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
    depends_on:
      chroma:
        condition: service_started
      redis:
        condition: service_started
