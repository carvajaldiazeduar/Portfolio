<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conversor</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; background: #f0f2f5; }
  .container { background: #fff; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 24px rgba(0,0,0,.1); width: 400px; }
  h1 { text-align: center; margin: 0 0 1.5rem; color: #1a1a2e; }
  .form-group { margin-bottom: 1rem; }
  label { display: block; margin-bottom: .25rem; font-weight: 600; color: #333; }
  input, select { width: 100%; padding: .6rem .75rem; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 1rem; }
  input:focus, select:focus { outline: none; border-color: #4a6cf7; }
  button { width: 100%; padding: .75rem; background: #4a6cf7; color: #fff; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; margin-top: .5rem; }
  button:hover { background: #3b5de7; }
  .result { margin-top: 1.5rem; padding: 1rem; border-radius: 8px; text-align: center; font-size: 1.25rem; font-weight: 600; display: none; }
  .result.success { display: block; background: #e8f5e9; color: #2e7d32; }
  .result.error { display: block; background: #fdecea; color: #c62828; }
</style>
</head>
<body>
<div class="container">
  <h1>Unit Conversor</h1>
  <div class="form-group">
    <label for="category">Category</label>
    <select id="category">
      <option value="length">Length</option>
      <option value="weight">Weight</option>
      <option value="temperature">Temperature</option>
    </select>
  </div>
  <div class="form-group">
    <label for="value">Value</label>
    <input type="number" id="value" step="any" value="1">
  </div>
  <div class="form-group">
    <label for="from">From</label>
    <select id="from"></select>
  </div>
  <div class="form-group">
    <label for="to">To</label>
    <select id="to"></select>
  </div>
  <button id="convertBtn">Convert</button>
  <div id="resultDisplay" class="result"></div>
</div>
<script>
const units = {
  length: ['meter','kilometer','centimeter','millimeter','mile','yard','foot','inch'],
  weight: ['kilogram','gram','milligram','pound','ounce'],
  temperature: ['celsius','fahrenheit','kelvin']
};

function populateUnits() {
  const cat = document.getElementById('category').value;
  const from = document.getElementById('from');
  const to = document.getElementById('to');
  const options = units[cat].map(u => `<option value="${u}">${u}</option>`).join('');
  from.innerHTML = options;
  to.innerHTML = options;
  to.value = units[cat][1] || units[cat][0];
}

document.getElementById('category').addEventListener('change', populateUnits);
populateUnits();

document.getElementById('convertBtn').addEventListener('click', async () => {
  const value = parseFloat(document.getElementById('value').value);
  const from = document.getElementById('from').value;
  const to = document.getElementById('to').value;
  const display = document.getElementById('resultDisplay');
  try {
    const res = await fetch('/api/convert', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ value, from, to })
    });
    const data = await res.json();
    if (data.error) {
      display.className = 'result error';
      display.textContent = data.error;
    } else {
      display.className = 'result success';
      display.textContent = `${value} ${from} = ${data.result} ${data.unit}`;
    }
  } catch (err) {
    display.className = 'result error';
    display.textContent = 'Network error';
  }
});
</script>
</body>
</html>
