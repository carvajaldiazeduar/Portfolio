<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Generator</title>
  <link rel='stylesheet' href='styles.css'>
</head>
<body>
  <div class="container">
    <h1>Password Generator</h1>
    <div id="msg" class="msg"></div>
    <div class="form-row">
      <div class="field">
        <input type="number" id="length" value="16" min="1" placeholder="Length">
      </div>
      <div class="checkbox-group">
        <label><input type="checkbox" id="uppercase" checked> Uppercase</label>
        <label><input type="checkbox" id="lowercase" checked> Lowercase</label>
        <label><input type="checkbox" id="numbers" checked> Numbers</label>
        <label><input type="checkbox" id="symbols"> Symbols</label>
      </div>
      <button onclick="generatePassword()">Generate</button>
      <button onclick="storePassword()" style="background:#2ecc71">Store</button>
    </div>
    <div class="result" id="result"></div>
    <table>
      <thead><tr><th>Password</th><th>Action</th></tr></thead>
      <tbody id="passwords-body"></tbody>
    </table>
  </div>
  <script src='app.js'></script>
</body>
</html>
