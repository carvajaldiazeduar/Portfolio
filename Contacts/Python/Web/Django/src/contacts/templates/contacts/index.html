<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contacts</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; background: #f0f2f5; }
  .container { background: #fff; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 24px rgba(0,0,0,.1); width: 500px; }
  h1 { text-align: center; margin: 0 0 1.5rem; color: #1a1a2e; }
  .form-row { display: flex; gap: .5rem; margin-bottom: 1rem; }
  .form-row input { flex: 1; padding: .5rem .75rem; border: 2px solid #e0e0e0; border-radius: 8px; font-size: .9rem; }
  .form-row input:focus { outline: none; border-color: #4a6cf7; }
  .form-row button { padding: .5rem 1rem; background: #4a6cf7; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; }
  .form-row button:hover { background: #3b5de7; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; padding: .5rem .75rem; border-bottom: 2px solid #e0e0e0; color: #555; }
  td { padding: .5rem .75rem; border-bottom: 1px solid #eee; }
  .delete-btn { background: #f44336; color: #fff; border: none; border-radius: 4px; padding: .25rem .5rem; cursor: pointer; font-size: .8rem; }
  .delete-btn:hover { background: #d32f2f; }
  .empty { text-align: center; color: #999; padding: 2rem; }
</style>
</head>
<body>
<div class="container">
  <h1>Contacts</h1>
  <div class="form-row">
    <input type="text" id="nameInput" placeholder="Name" autofocus>
    <input type="text" id="phoneInput" placeholder="Phone">
    <input type="email" id="emailInput" placeholder="Email">
    <button id="addBtn">Add</button>
  </div>
  <div id="contactList"></div>
</div>
<script>
async function loadContacts() {
  const res = await fetch('/api/contacts');
  const data = await res.json();
  const container = document.getElementById('contactList');
  if (data.contacts.length === 0) {
    container.innerHTML = '<div class="empty">No contacts yet</div>';
    return;
  }
  container.innerHTML = `<table><thead><tr><th>Name</th><th>Phone</th><th>Email</th><th></th></tr></thead><tbody>${data.contacts.map(c => `<tr><td>${c.name}</td><td>${c.phone}</td><td>${c.email}</td><td><button class="delete-btn" data-id="${c.id}">Delete</button></td></tr>`).join('')}</tbody></table>`;
  container.querySelectorAll('.delete-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      await fetch(`/api/contacts/${btn.dataset.id}`, { method: 'DELETE' });
      loadContacts();
    });
  });
}

document.getElementById('addBtn').addEventListener('click', async () => {
  const name = document.getElementById('nameInput').value.trim();
  const phone = document.getElementById('phoneInput').value.trim();
  const email = document.getElementById('emailInput').value.trim();
  if (!name) return;
  await fetch('/api/contacts', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name, phone, email })
  });
  document.getElementById('nameInput').value = '';
  document.getElementById('phoneInput').value = '';
  document.getElementById('emailInput').value = '';
  loadContacts();
});

loadContacts();
</script>
</body>
</html>
