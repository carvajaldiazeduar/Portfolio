services:
  event-processor-api:
    build: .
    ports:
      - "3000:3000"
    environment:
      - QUEUE_DRIVER=redis
      - REDIS_HOST=redis:6379
    depends_on:
      - redis
    networks:
      - event-network

  event-processor-worker:
    build: .
    command: node worker.js
    environment:
      - QUEUE_DRIVER=redis
      - REDIS_HOST=redis:6379
      - WORKER_METRICS_PORT=3001
    depends_on:
      - redis
    networks:
      - event-network

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - event-processor-api
      - event-processor-worker
    networks:
      - event-network

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
    networks:
      - event-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - event-network

  # Alternative queue backends (commented out)
  # rabbitmq:
  #   image: rabbitmq:3-management-alpine
  #   ports:
  #     - "5672:5672"
  #     - "15672:15672"
  #   networks:
  #     - event-network

  # kafka:
  #   image: confluentinc/cp-kafka:7.5.0
  #   ports:
  #     - "9092:9092"
