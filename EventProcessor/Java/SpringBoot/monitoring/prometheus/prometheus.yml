global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: event-processor-api
    metrics_path: /metrics
    static_configs:
      - targets: ["event-processor-api:5000"]

  - job_name: event-processor-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["event-processor-worker:3001"]