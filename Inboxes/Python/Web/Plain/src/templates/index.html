<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inbox</title>

    <link rel='stylesheet' href='{{ url_for('static', filename='styles.css') }}'>
</head>
<body>
<h1>Inbox</h1>

<h2>Send Message</h2>
<form id="send-form">
  <input type="text" id="from" placeholder="From" required>
  <input type="text" id="subject" placeholder="Subject" required>
  <textarea id="body" placeholder="Body" rows="3"></textarea>
  <button type="submit">Send</button>
</form>

<h2>Messages</h2>
<table id="messages-table">
  <thead><tr><th>ID</th><th>From</th><th>Subject</th><th>Status</th><th>Date</th><th></th></tr></thead>
  <tbody id="messages-body"></tbody>
</table>

<div id="message-detail" style="display:none;">
  <h3>Message Detail</h3>
  <p><strong>From:</strong> <span id="detail-from"></span></p>
  <p><strong>Subject:</strong> <span id="detail-subject"></span></p>
  <p><strong>Date:</strong> <span id="detail-date"></span></p>
  <p><strong>Body:</strong></p>
  <p id="detail-body"></p>
  <button onclick="document.getElementById('message-detail').style.display='none'">Close</button>
</div>


    <script src='{{ url_for('static', filename='app.js') }}'></script>
</body>
</html>
