<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inboxes</title>

    <link rel='stylesheet' href='styles.css'>
</head>
<body>
<div class="container">
  <h1>Inboxes</h1>

    <script src='app.js'></script>
