name: CI

on:
  push:
  pull_request:

# Multi-database matrix for csharp/python/java (sqlite, pgsql, mysql,
# mongodb, sqlserver). Java runs a subset: no mongodb (no JDBC driver in
# DataSourceConfig). PHP only lints source files. The mssql:2022 image
# defaults to encrypted connections, so sqlcmd is invoked with `-C` (trust
# server certificate) and mssql-tools18 is installed on the runner (pinned to
# its OS version, best-effort); see AGENTS.md "Local CI (multi-database)".
jobs:
  csharp:
    name: C# (.NET 10) ${{ matrix.db_driver }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - db_driver: sqlite
            db_host: ""
            db_port: ""
            db_user: ""
            db_pass: ""
            db_file: ""
            services: {}
          - db_driver: pgsql
            db_host: 127.0.0.1
            db_port: "5432"
            db_user: postgres
            db_pass: postgres
            db_file: ""
            services:
              postgres:
                image: postgres:16
                ports: ['5432:5432']
                env:
                  POSTGRES_USER: postgres
                  POSTGRES_PASSWORD: postgres
                  POSTGRES_DB: postgres
                options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
          - db_driver: mysql
            db_host: 127.0.0.1
            db_port: "3306"
            db_user: root
            db_pass: secret
            db_file: ""
            services:
              mariadb:
                image: mariadb:11
                ports: ['3306:3306']
                env:
                  MARIADB_ROOT_PASSWORD: secret
                options: --health-cmd "mariadb-admin ping -h 127.0.0.1 -uroot -psecret --silent" --health-interval 10s --health-timeout 5s --health-retries 10
          - db_driver: mongodb
            db_host: 127.0.0.1
            db_port: "27017"
            db_user: ""
            db_pass: ""
            db_file: ""
            services:
              mongo:
                image: mongo:7
                ports: ['27017:27017']
                options: --health-cmd "mongosh --eval '1'" --health-interval 10s --health-timeout 5s --health-retries 30
          - db_driver: sqlserver
            db_host: 127.0.0.1
            db_port: "1433"
            db_user: sa
            db_pass: 'SqlServer123!'
            db_file: ""
            services:
              sqlserver:
                image: mcr.microsoft.com/mssql/server:2022-latest
                ports: ['1433:1433']
                env:
                  ACCEPT_EULA: 'Y'
                  MSSQL_SA_PASSWORD: 'SqlServer123!'
                  MSSQL_PID: 'Developer'
                options: --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$MSSQL_SA_PASSWORD" -Q 'SELECT 1' -C -b" --health-interval 10s --health-timeout 5s --health-retries 15
    env:
      DB_DRIVER: ${{ matrix.db_driver }}
      DB_HOST: ${{ matrix.db_host }}
      DB_PORT: ${{ matrix.db_port }}
      DB_USER: ${{ matrix.db_user }}
      DB_PASSWORD: ${{ matrix.db_pass }}
      DB_FILE: ${{ matrix.db_file }}
      CACHE_TYPE: local
    services: ${{ matrix.services }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Install clients + create databases
        if: matrix.db_driver != 'sqlite'
        shell: bash
        run: |
          for i in 1 2 3; do timeout 120 sudo apt-get update -qq && break; echo "apt-get update attempt $i failed"; sleep 5; done
          for i in 1 2 3; do timeout 120 sudo apt-get install -y -qq postgresql-client default-mysql-client && break; echo "apt-get install attempt $i failed"; sleep 5; done
          if [ "$DB_DRIVER" = "sqlserver" ]; then
            curl --retry 3 --retry-connrefused --retry-delay 2 -fsSL https://packages.microsoft.com/keys/microsoft.asc | sudo gpg --dearmor -o /usr/share/keyrings/microsoft-prod.gpg || true
            curl --retry 3 --retry-connrefused --retry-delay 2 -fsSL "https://packages.microsoft.com/config/ubuntu/$(. /etc/os-release; echo $VERSION_ID)/prod.list" | sudo tee /etc/apt/sources.list.d/mssql-release.list >/dev/null || true
            sudo apt-get update -qq && sudo ACCEPT_EULA=Y apt-get install -y -qq mssql-tools18 2>/dev/null || true
          fi
          if [ -n "$DB_HOST" ] && [ "$DB_DRIVER" = "sqlserver" ]; then
            for i in $(seq 1 30); do
              if /opt/mssql-tools18/bin/sqlcmd -S "$DB_HOST,$DB_PORT" -U "$DB_USER" -P "$DB_PASSWORD" -Q 'SELECT 1' -C -b >/dev/null 2>&1; then break; fi
              echo "waiting for sqlserver at $DB_HOST..."; sleep 2
            done
          fi
          for db in inboxes passwords; do
            case "$DB_DRIVER" in
              pgsql)   PGPASSWORD=$DB_PASSWORD psql -h $DB_HOST -U $DB_USER -tc "SELECT 1 FROM pg_database WHERE datname='$db'" | grep -q 1 || PGPASSWORD=$DB_PASSWORD psql -h $DB_HOST -U $DB_USER -c "CREATE DATABASE $db" 2>/dev/null || true ;;
              mysql)   mysql -h $DB_HOST -u$DB_USER -p$DB_PASSWORD -e "CREATE DATABASE IF NOT EXISTS $db" 2>/dev/null || true ;;
              sqlserver) /opt/mssql-tools18/bin/sqlcmd -S "$DB_HOST,$DB_PORT" -U "$DB_USER" -P "$DB_PASSWORD" -Q "IF DB_ID('$db') IS NULL CREATE DATABASE [$db]" -C -b 2>/dev/null || true ;;
            esac
          done
      - name: Test all C# projects
        shell: bash
        run: |
          set -e
          for csproj in $(find . -name '*.Tests.csproj' | sort); do
            echo "=== $csproj ==="
            dotnet test "$csproj" --nologo
          done

  python:
    name: Python (pytest) ${{ matrix.db_driver }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - db_driver: sqlite
            db_host: ""
            db_port: ""
            db_user: ""
            db_pass: ""
            db_file: ""
            services: {}
          - db_driver: pgsql
            db_host: 127.0.0.1
            db_port: "5432"
            db_user: postgres
            db_pass: postgres
            db_file: ""
            services:
              postgres:
                image: postgres:16
                ports: ['5432:5432']
                env:
                  POSTGRES_USER: postgres
                  POSTGRES_PASSWORD: postgres
                  POSTGRES_DB: postgres
                options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
          - db_driver: mysql
            db_host: 127.0.0.1
            db_port: "3306"
            db_user: root
            db_pass: secret
            db_file: ""
            services:
              mariadb:
                image: mariadb:11
                ports: ['3306:3306']
                env:
                  MARIADB_ROOT_PASSWORD: secret
                options: --health-cmd "mariadb-admin ping -h 127.0.0.1 -uroot -psecret --silent" --health-interval 10s --health-timeout 5s --health-retries 10
          - db_driver: mongodb
            db_host: 127.0.0.1
            db_port: "27017"
            db_user: ""
            db_pass: ""
            db_file: ""
            services:
              mongo:
                image: mongo:7
                ports: ['27017:27017']
                options: --health-cmd "mongosh --eval '1'" --health-interval 10s --health-timeout 5s --health-retries 30
          - db_driver: sqlserver
            db_host: 127.0.0.1
            db_port: "1433"
            db_user: sa
            db_pass: 'SqlServer123!'
            db_file: ""
            services:
              sqlserver:
                image: mcr.microsoft.com/mssql/server:2022-latest
                ports: ['1433:1433']
                env:
                  ACCEPT_EULA: 'Y'
                  MSSQL_SA_PASSWORD: 'SqlServer123!'
                  MSSQL_PID: 'Developer'
                options: --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$MSSQL_SA_PASSWORD" -Q 'SELECT 1' -C -b" --health-interval 10s --health-timeout 5s --health-retries 15
    env:
      DB_DRIVER: ${{ matrix.db_driver }}
      DB_HOST: ${{ matrix.db_host }}
      DB_PORT: ${{ matrix.db_port }}
      DB_USER: ${{ matrix.db_user }}
      DB_PASSWORD: ${{ matrix.db_pass }}
      DB_FILE: ${{ matrix.db_file }}
      CACHE_TYPE: local
    services: ${{ matrix.services }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install --quiet pytest flask flask-sqlalchemy redis psycopg2-binary pymysql pymongo pymssql chromadb pinecone-client duckdb fastapi uvicorn httpx python-multipart "moto[server]>=5.0,<6"
          if [ "$DB_DRIVER" = "sqlserver" ]; then
            printf '[global]\n  tds version = 7.4\n  trust = yes\n' > ~/.freetds.conf
          fi
      - name: Create databases
        if: matrix.db_driver != 'sqlite'
        shell: bash
        run: |
          for i in 1 2 3; do timeout 120 sudo apt-get update -qq && break; echo "apt-get update attempt $i failed"; sleep 5; done
          for i in 1 2 3; do timeout 120 sudo apt-get install -y -qq postgresql-client default-mysql-client && break; echo "apt-get install attempt $i failed"; sleep 5; done
          if [ "$DB_DRIVER" = "sqlserver" ]; then
            curl --retry 3 --retry-connrefused --retry-delay 2 -fsSL https://packages.microsoft.com/keys/microsoft.asc | sudo gpg --dearmor -o /usr/share/keyrings/microsoft-prod.gpg || true
            curl --retry 3 --retry-connrefused --retry-delay 2 -fsSL "https://packages.microsoft.com/config/ubuntu/$(. /etc/os-release; echo $VERSION_ID)/prod.list" | sudo tee /etc/apt/sources.list.d/mssql-release.list >/dev/null || true
            sudo apt-get update -qq && sudo ACCEPT_EULA=Y apt-get install -y -qq mssql-tools18 2>/dev/null || true
          fi
          if [ -n "$DB_HOST" ] && [ "$DB_DRIVER" = "sqlserver" ]; then
            for i in $(seq 1 30); do
              if /opt/mssql-tools18/bin/sqlcmd -S "$DB_HOST,$DB_PORT" -U "$DB_USER" -P "$DB_PASSWORD" -Q 'SELECT 1' -C -b >/dev/null 2>&1; then break; fi
              echo "waiting for sqlserver at $DB_HOST..."; sleep 2
            done
          fi
          for db in inboxes passwords; do
            case "$DB_DRIVER" in
              pgsql)   PGPASSWORD=$DB_PASSWORD psql -h $DB_HOST -U $DB_USER -tc "SELECT 1 FROM pg_database WHERE datname='$db'" | grep -q 1 || PGPASSWORD=$DB_PASSWORD psql -h $DB_HOST -U $DB_USER -c "CREATE DATABASE $db" 2>/dev/null || true ;;
              mysql)   mysql -h $DB_HOST -u$DB_USER -p$DB_PASSWORD -e "CREATE DATABASE IF NOT EXISTS $db" 2>/dev/null || true ;;
              sqlserver) /opt/mssql-tools18/bin/sqlcmd -S "$DB_HOST,$DB_PORT" -U "$DB_USER" -P "$DB_PASSWORD" -Q "IF DB_ID('$db') IS NULL CREATE DATABASE [$db]" -C -b 2>/dev/null || true ;;
            esac
          done
      - name: Test all Python projects
        shell: bash
        run: |
          set -e
          for t in $(find . -type d -name tests -path '*/Python/*' | sort); do
            d=$(dirname "$t")
            echo "=== $d ==="
            (cd "$d" && python -m pytest -q)
          done

  php:
    name: PHP (lint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Lint all PHP files
        shell: bash
        run: |
          set -e
          for f in $(find . -name '*.php' -not -path '*/vendor/*' | sort); do
            php -l "$f" > /dev/null
          done

  ruby:
    name: Ruby (minitest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
      - name: Test Rails projects
        shell: bash
        run: |
          set -e
          for tdir in $(find . -type d -path '*/RubyOnRails/src/test' | sort); do
            if [ -z "$(find "$tdir" -name '*_test.rb' | head -1)" ]; then
              echo "=== $(dirname "$tdir") (no tests, skipped) ==="
              continue
            fi
            src=$(dirname "$tdir")
            echo "=== $src ==="
            (cd "$src" && bundle install --quiet && RAILS_ENV=test DB_DRIVER=sqlite DB_FILE=/tmp/inboxes_test.db bundle exec ruby -Itest -I. -e 'require "config/environment"; ActiveRecord::Base.connection.migration_context.migrate; Dir["test/**/*_test.rb"].sort.each { |f| require File.expand_path(f) }')
          done

  java:
    name: Java (Maven) ${{ matrix.db_driver }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - db_driver: sqlite
            db_host: ""
            db_port: ""
            db_user: ""
            db_pass: ""
            db_file: ""
            services: {}
          - db_driver: pgsql
            db_host: 127.0.0.1
            db_port: "5432"
            db_user: postgres
            db_pass: postgres
            db_file: ""
            services:
              postgres:
                image: postgres:16
                ports: ['5432:5432']
                env:
                  POSTGRES_USER: postgres
                  POSTGRES_PASSWORD: postgres
                  POSTGRES_DB: postgres
                options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
          - db_driver: mysql
            db_host: 127.0.0.1
            db_port: "3306"
            db_user: root
            db_pass: secret
            db_file: ""
            services:
              mariadb:
                image: mariadb:11
                ports: ['3306:3306']
                env:
                  MARIADB_ROOT_PASSWORD: secret
                options: --health-cmd "mariadb-admin ping -h 127.0.0.1 -uroot -psecret --silent" --health-interval 10s --health-timeout 5s --health-retries 10
          - db_driver: sqlserver
            db_host: 127.0.0.1
            db_port: "1433"
            db_user: sa
            db_pass: 'SqlServer123!'
            db_file: ""
            services:
              sqlserver:
                image: mcr.microsoft.com/mssql/server:2022-latest
                ports: ['1433:1433']
                env:
                  ACCEPT_EULA: 'Y'
                  MSSQL_SA_PASSWORD: 'SqlServer123!'
                  MSSQL_PID: 'Developer'
                options: --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$MSSQL_SA_PASSWORD" -Q 'SELECT 1' -C -b" --health-interval 10s --health-timeout 5s --health-retries 15
    env:
      DB_DRIVER: ${{ matrix.db_driver }}
      DB_HOST: ${{ matrix.db_host }}
      DB_PORT: ${{ matrix.db_port }}
      DB_USER: ${{ matrix.db_user }}
      DB_PASSWORD: ${{ matrix.db_pass }}
      DB_FILE: ${{ matrix.db_file }}
      CACHE_TYPE: local
      # Temurin 21.0.11's C1 JIT crashes on ConcurrentHashMap::putVal (see AGENTS.md).
      JAVA_TOOL_OPTIONS: -XX:-TieredCompilation
    services: ${{ matrix.services }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install clients + create databases
        if: matrix.db_driver != 'sqlite'
        shell: bash
        run: |
          for i in 1 2 3; do timeout 120 sudo apt-get update -qq && break; echo "apt-get update attempt $i failed"; sleep 5; done
          for i in 1 2 3; do timeout 120 sudo apt-get install -y -qq postgresql-client default-mysql-client && break; echo "apt-get install attempt $i failed"; sleep 5; done
          if [ "$DB_DRIVER" = "sqlserver" ]; then
            curl --retry 3 --retry-connrefused --retry-delay 2 -fsSL https://packages.microsoft.com/keys/microsoft.asc | sudo gpg --dearmor -o /usr/share/keyrings/microsoft-prod.gpg || true
