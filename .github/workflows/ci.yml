name: CI

on:
  push:
  pull_request:

jobs:
  csharp:
    name: C# (.NET 9)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Test all projects
        shell: bash
        run: |
          set -e
          for csproj in $(find . -name '*.Tests.csproj' -not -path '*/node_modules/*' | sort); do
            echo "=== $csproj ==="
            dotnet test "$csproj" --nologo
          done

  python:
    name: Python (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install --quiet pytest flask flask-sqlalchemy redis psycopg2-binary pymysql pymongo pymssql chromadb pinecone-client duckdb fastapi uvicorn httpx python-multipart
      - name: Test all projects
        shell: bash
        run: |
          set -e
          for t in $(find . -type d -name tests -path '*/Python/*' | sort); do
            d=$(dirname "$t")
            echo "=== $d ==="
            (cd "$d" && python -m pytest -q)
          done

  node:
    name: Node.js (Jest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Create test databases
        shell: bash
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          for db in contacts inboxes passwords taskslist; do
            PGPASSWORD=postgres psql -h localhost -U postgres -tc "SELECT 1 FROM pg_database WHERE datname='$db'" | grep -q 1 || PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE $db"
          done
      - name: Test all projects
        shell: bash
        run: |
          set -e
          for pkg in $(find . -name package.json -path '*/Node.js/*' -not -path '*/node_modules/*' | sort); do
            d=$(dirname "$pkg")
            [ -d "$d/tests" ] || continue
            echo "=== $d ==="
            (cd "$d" && npm install --no-fund --no-audit)
            if [ -d "$d/prisma" ]; then
              db=$(sed -n "s/.*DB_NAME.*|| '\([^']*\)'.*/\1/p" "$d/server.js")
              (cd "$d" && DATABASE_URL="postgresql://postgres:postgres@localhost:5432/$db" npx prisma generate && DATABASE_URL="postgresql://postgres:postgres@localhost:5432/$db" npx prisma db push --accept-data-loss --skip-generate)
              (cd "$d" && DATABASE_URL="postgresql://postgres:postgres@localhost:5432/$db" CACHE_TYPE=local npx jest --ci --runInBand --forceExit)
            else
              (cd "$d" && CACHE_TYPE=local npx jest --ci --runInBand --forceExit)
            fi
          done

  php:
    name: PHP (lint + assert)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Lint all PHP files
        shell: bash
        run: |
          set -e
          for f in $(find . -name '*.php' -not -path '*/vendor/*' | sort); do
            php -l "$f" > /dev/null
          done
      - name: ChatAI PHP test
        working-directory: ChatAI/PHP/Web/Plain/src
        run: php -d zend.assertions=1 -d assert.exception=1 tests/test_app.php
      - name: PHP CLI tests
        shell: bash
        run: |
          set -e
          for test in $(find . -path '*/PHP/Cli/tests/*Test.php' | sort); do
            echo "=== $test ==="
            php -d zend.assertions=1 -d assert.exception=1 "$test"
          done
      - name: PHP Web Plain tests
        shell: bash
        run: |
          set -e
          for tdir in $(find . -type d -path '*/PHP/Web/Plain/src/tests' | sort); do
            src=$(dirname "$tdir")
            proj=${src%%/*}
            db="/tmp/${proj}-web-test.db"
            rm -f "$db"
            echo "=== $src ==="
            : > /tmp/php-web-server.log
            (
              cd "$src"
              DB_DRIVER=sqlite DB_FILE="$db" CACHE_TYPE=local php -S 127.0.0.1:8000 index.php >/tmp/php-web-server.log 2>&1 &
              SRVPID=$!
              ready=0
              for i in $(seq 1 60); do
                if php -r '$h=@file_get_contents("http://127.0.0.1:8000/"); exit($h!==false?0:1);' 2>/dev/null; then ready=1; break; fi
                sleep 1
              done
              if [ "$ready" != 1 ]; then echo "ERROR: server not ready for $src"; cat /tmp/php-web-server.log; kill $SRVPID 2>/dev/null || true; exit 1; fi
              for test in "$tdir"/*Test.php; do
                [ -f "$test" ] || continue
                echo "--- $(basename "$test") ---"
                DB_DRIVER=sqlite DB_FILE="$db" CACHE_TYPE=local php -d zend.assertions=1 -d assert.exception=1 "$test"
              done
              kill $SRVPID 2>/dev/null || true
              wait $SRVPID 2>/dev/null || true
            )
          done

  ruby:
    name: Ruby (minitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
      - name: Install ChatAI dependencies
        working-directory: ChatAI/Ruby/Web/Plain/src
        run: bundle install
      - name: Test CLI projects
        shell: bash
        run: |
          set -e
          for test in $(find . -name '*_test.rb' -not -path '*/node_modules/*' -not -path '*/ChatAI/*' -not -path '*/RubyOnRails/src/test/*' | sort); do
            echo "=== $test ==="
            ruby "$test"
          done
      - name: ChatAI Ruby test
        working-directory: ChatAI/Ruby/Web/Plain/src
        run: bundle exec ruby -I. tests/test_server.rb
      - name: Test Rails projects
        shell: bash
        run: |
          set -e
          for tdir in $(find . -type d -path '*/RubyOnRails/src/test' | sort); do
            if [ -z "$(find "$tdir" -name '*_test.rb' | head -1)" ]; then
              echo "=== $(dirname "$tdir") (no tests, skipped) ==="
              continue
            fi
            src=$(dirname "$tdir")
            echo "=== $src ==="
            (cd "$src" && bundle install --quiet && RAILS_ENV=test DB_DRIVER=sqlite DB_FILE=/tmp/contacts_test.db bundle exec ruby -Itest -I. -e 'require "config/environment"; ActiveRecord::Base.connection.migration_context.migrate; Dir["test/**/*_test.rb"].sort.each { |f| require File.expand_path(f) }')
          done
