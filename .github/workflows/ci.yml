name: CI

on:
  push:
  pull_request:

jobs:
  csharp:
    name: C# (AspNetMinimalApi)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ChatAI/CSharp/Web/AspNetMinimalApi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Build
        run: dotnet build src/ChatAI.csproj --nologo
      - name: Test
        run: dotnet test src/tests/ChatAI.Tests.csproj --nologo

  python:
    name: Python (Flask)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ChatAI/Python/Web/Plain
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r src/requirements.txt
      - name: Test
        working-directory: ChatAI/Python/Web/Plain/src
        run: python -m pytest -q

  node:
    name: Node.js (Express)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ChatAI/Node.js/Web/Plain
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
        working-directory: ChatAI/Node.js/Web/Plain/src
      - name: Test
        working-directory: ChatAI/Node.js/Web/Plain/src
        run: npm test

  php:
    name: PHP (Plain)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Lint
        working-directory: ChatAI/PHP/Web/Plain/src
        run: php -l index.php

  ruby:
    name: Ruby (WEBrick)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
      - name: Install dependencies
        working-directory: ChatAI/Ruby/Web/Plain/src
        run: bundle install
      - name: Test
        working-directory: ChatAI/Ruby/Web/Plain/src
        run: bundle exec ruby -I. tests/test_server.rb
