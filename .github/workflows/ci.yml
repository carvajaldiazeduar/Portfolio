name: CI

on:
  push:
  pull_request:

# Multi-database matrix.
# Each DB-backed job runs against sqlite, pgsql, mysql and mongodb.
# `sqlserver` (MSSQL) is exercised locally via `scripts/ci-local.sh` only,
# because the mssql:2022 container defaults to encrypted connections that
# need extra client tuning (see AGENTS.md "Local CI (multi-database)").
# Java runs a subset: no mongodb (no JDBC driver in DataSourceConfig).
jobs:
  csharp:
    name: C# (.NET 9) ${{ matrix.db_driver }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - db_driver: sqlite
            db_host: ""
            db_port: ""
            db_user: ""
            db_pass: ""
            db_file: ""
            services: {}
          - db_driver: pgsql
            db_host: 127.0.0.1
            db_port: "5432"
            db_user: postgres
            db_pass: postgres
            db_file: ""
            services:
              postgres:
                image: postgres:16
                ports: ['5432:5432']
                env:
                  POSTGRES_USER: postgres
                  POSTGRES_PASSWORD: postgres
                  POSTGRES_DB: postgres
                options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
          - db_driver: mysql
            db_host: 127.0.0.1
            db_port: "3306"
            db_user: root
            db_pass: secret
            db_file: ""
            services:
              mariadb:
                image: mariadb:11
                ports: ['3306:3306']
                env:
                  MARIADB_ROOT_PASSWORD: secret
                options: --health-cmd "mariadb-admin ping -h 127.0.0.1 -uroot -psecret --silent" --health-interval 10s --health-timeout 5s --health-retries 10
          - db_driver: mongodb
            db_host: 127.0.0.1
            db_port: "27017"
            db_user: ""
            db_pass: ""
            db_file: ""
            services:
              mongo:
                image: mongo:7
                ports: ['27017:27017']
                options: --health-cmd "mongosh --eval '1'" --health-interval 10s --health-timeout 5s --health-retries 30
          - db_driver: sqlserver
            db_host: 127.0.0.1
            db_port: "1433"
            db_user: sa
            db_pass: 'SqlServer123!'
            db_file: ""
            services:
              sqlserver:
                image: mcr.microsoft.com/mssql/server:2022-latest
                ports: ['1433:1433']
                env:
                  ACCEPT_EULA: 'Y'
                  MSSQL_SA_PASSWORD: 'SqlServer123!'
                  MSSQL_PID: 'Developer'
                options: --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$MSSQL_SA_PASSWORD" -Q 'SELECT 1' -C -b" --health-interval 10s --health-timeout 5s --health-retries 15
    env:
      DB_DRIVER: ${{ matrix.db_driver }}
      DB_HOST: ${{ matrix.db_host }}
      DB_PORT: ${{ matrix.db_port }}
      DB_USER: ${{ matrix.db_user }}
      DB_PASSWORD: ${{ matrix.db_pass }}
      DB_FILE: ${{ matrix.db_file }}
      CACHE_TYPE: local
    services: ${{ matrix.services }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Install clients + create databases
        if: matrix.db_driver != 'sqlite'
        shell: bash
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client default-mysql-client
          if [ "$DB_DRIVER" = "sqlserver" ]; then
            curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | sudo gpg --dearmor -o /usr/share/keyrings/microsoft-prod.gpg
            curl -fsSL https://packages.microsoft.com/config/ubuntu/22.04/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list >/dev/null
            sudo apt-get update -qq && sudo ACCEPT_EULA=Y apt-get install -y -qq mssql-tools18
          fi
          if [ -n "$DB_HOST" ] && [ "$DB_DRIVER" = "sqlserver" ]; then
            for i in $(seq 1 30); do
              if /opt/mssql-tools18/bin/sqlcmd -S "$DB_HOST,$DB_PORT" -U "$DB_USER" -P "$DB_PASSWORD" -Q 'SELECT 1' -C -b >/dev/null 2>&1; then break; fi
              echo "waiting for sqlserver at $DB_HOST..."; sleep 2
            done
          fi
          for db in contacts inboxes passwords tasks; do
            case "$DB_DRIVER" in
              pgsql)   PGPASSWORD=$DB_PASSWORD psql -h $DB_HOST -U $DB_USER -tc "SELECT 1 FROM pg_database WHERE datname='$db'" | grep -q 1 || PGPASSWORD=$DB_PASSWORD psql -h $DB_HOST -U $DB_USER -c "CREATE DATABASE $db" 2>/dev/null || true ;;
              mysql)   mysql -h $DB_HOST -u$DB_USER -p$DB_PASSWORD -e "CREATE DATABASE IF NOT EXISTS $db" 2>/dev/null || true ;;
              sqlserver) /opt/mssql-tools18/bin/sqlcmd -S "$DB_HOST,$DB_PORT" -U "$DB_USER" -P "$DB_PASSWORD" -Q "IF DB_ID('$db') IS NULL CREATE DATABASE [$db]" -C -b 2>/dev/null || true ;;
            esac
          done
      - name: Test all C# projects
        shell: bash
        run: |
          set -e
          for csproj in $(find . -name '*.Tests.csproj' -not -path '*/node_modules/*' | sort); do
            echo "=== $csproj ==="
            dotnet test "$csproj" --nologo
          done

  python:
    name: Python (pytest) ${{ matrix.db_driver }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - db_driver: sqlite
            db_host: ""
            db_port: ""
            db_user: ""
