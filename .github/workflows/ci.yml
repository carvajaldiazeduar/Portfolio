          - db_driver: mongodb
            db_host: 127.0.0.1
            db_port: "27017"
            db_user: ""
            db_pass: ""
            db_file: ""
            services:
              mongo:
                image: mongo:7
                ports: ['27017:27017']
                options: --health-cmd "mongosh --eval '1'" --health-interval 10s --health-timeout 5s --health-retries 30
    env:
      DB_DRIVER: ${{ matrix.db_driver }}
      DB_HOST: ${{ matrix.db_host }}
      DB_PORT: ${{ matrix.db_port }}
      DB_USER: ${{ matrix.db_user }}
      DB_PASSWORD: ${{ matrix.db_pass }}
      DB_FILE: ${{ matrix.db_file }}
      CACHE_TYPE: local
    services: ${{ matrix.services }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_pgsql, pdo_mysql, pdo_sqlite, mongodb
      - name: Create databases
        if: matrix.db_driver != 'sqlite'
        shell: bash
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client default-mysql-client
          if [ "$DB_DRIVER" = "sqlserver" ]; then
            curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | sudo gpg --dearmor -o /usr/share/keyrings/microsoft-prod.gpg
            curl -fsSL https://packages.microsoft.com/config/ubuntu/22.04/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list >/dev/null
            sudo apt-get update -qq && sudo ACCEPT_EULA=Y apt-get install -y -qq mssql-tools18
          fi
          if [ -n "$DB_HOST" ] && [ "$DB_DRIVER" = "sqlserver" ]; then
            for i in $(seq 1 30); do
              if /opt/mssql-tools18/bin/sqlcmd -S "$DB_HOST,$DB_PORT" -U "$DB_USER" -P "$DB_PASSWORD" -Q 'SELECT 1' -C -b >/dev/null 2>&1; then break; fi
              echo "waiting for sqlserver at $DB_HOST..."; sleep 2
            done
          fi
          for db in contacts inboxes passwords tasks; do
            case "$DB_DRIVER" in
              pgsql)   PGPASSWORD=$DB_PASSWORD psql -h $DB_HOST -U $DB_USER -tc "SELECT 1 FROM pg_database WHERE datname='$db'" | grep -q 1 || PGPASSWORD=$DB_PASSWORD psql -h $DB_HOST -U $DB_USER -c "CREATE DATABASE $db" 2>/dev/null || true ;;
              mysql)   mysql -h $DB_HOST -u$DB_USER -p$DB_PASSWORD -e "CREATE DATABASE IF NOT EXISTS $db" 2>/dev/null || true ;;
              sqlserver) /opt/mssql-tools18/bin/sqlcmd -S "$DB_HOST,$DB_PORT" -U "$DB_USER" -P "$DB_PASSWORD" -Q "IF DB_ID('$db') IS NULL CREATE DATABASE [$db]" -C -b 2>/dev/null || true ;;
            esac
          done
      - name: Lint all PHP files
        shell: bash
        run: |
          set -e
          for f in $(find . -name '*.php' -not -path '*/vendor/*' | sort); do
            php -l "$f" > /dev/null
          done
      - name: ChatAI PHP test
        working-directory: ChatAI/PHP/Web/Plain/src
        run: php -d zend.assertions=1 -d assert.exception=1 tests/test_app.php
      - name: PHP CLI tests
        shell: bash
        run: |
          set -e
          for test in $(find . -path '*/PHP/Cli/tests/*Test.php' | sort); do
            echo "=== $test ==="
            php -d zend.assertions=1 -d assert.exception=1 "$test"
          done
      - name: PHP Web Plain tests
        shell: bash
        run: |
          set -e
          for tdir in $(find . -type d -path '*/PHP/Web/Plain/src/tests' | sort); do
            src=$(dirname "$tdir")
            echo "=== $src ==="
            dbfile="/tmp/php-web-$(echo "$src" | md5sum | cut -c1-8).db"
            : > /tmp/php-web-server.log
            (
              cd "$src"
              rm -f "$dbfile"
              DB_DRIVER=$DB_DRIVER DB_HOST=$DB_HOST DB_PORT=$DB_PORT DB_USER=$DB_USER DB_PASSWORD=$DB_PASSWORD DB_FILE="$dbfile" CACHE_TYPE=local php -S 127.0.0.1:8000 index.php >/tmp/php-web-server.log 2>&1 &
              SRVPID=$!
              ready=0
              for i in $(seq 1 60); do
                if php -r '$h=@file_get_contents("http://127.0.0.1:8000/"); exit($h!==false?0:1);' 2>/dev/null; then ready=1; break; fi
                sleep 1
              done
              if [ "$ready" != 1 ]; then echo "ERROR: server not ready for $src"; cat /tmp/php-web-server.log; kill $SRVPID 2>/dev/null || true; exit 1; fi
              for test in "$tdir"/*Test.php; do
                [ -f "$test" ] || continue
                echo "--- $(basename "$test") ---"
                DB_DRIVER=$DB_DRIVER DB_HOST=$DB_HOST DB_PORT=$DB_PORT DB_USER=$DB_USER DB_PASSWORD=$DB_PASSWORD DB_FILE="$dbfile" CACHE_TYPE=local php -d zend.assertions=1 -d assert.exception=1 "$test"
              done
              kill $SRVPID 2>/dev/null || true
              wait $SRVPID 2>/dev/null || true
            )
          done

  ruby:
    name: Ruby (minitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
      - name: Install ChatAI dependencies
        working-directory: ChatAI/Ruby/Web/Plain/src
        run: bundle install
      - name: Test CLI projects
        shell: bash
        run: |
          set -e
          for test in $(find . -name '*_test.rb' -not -path '*/node_modules/*' -not -path '*/ChatAI/*' -not -path '*/RubyOnRails/src/test/*' | sort); do
            echo "=== $test ==="
            ruby "$test"
          done
      - name: ChatAI Ruby test
        working-directory: ChatAI/Ruby/Web/Plain/src
        run: bundle exec ruby -I. tests/test_server.rb
      - name: Test Rails projects
        shell: bash
        run: |
          set -e
          for tdir in $(find . -type d -path '*/RubyOnRails/src/test' | sort); do
            if [ -z "$(find "$tdir" -name '*_test.rb' | head -1)" ]; then
              echo "=== $(dirname "$tdir") (no tests, skipped) ==="
              continue
            fi
            src=$(dirname "$tdir")
            echo "=== $src ==="
            (cd "$src" && bundle install --quiet && RAILS_ENV=test DB_DRIVER=sqlite DB_FILE=/tmp/contacts_test.db bundle exec ruby -Itest -I. -e 'require "config/environment"; ActiveRecord::Base.connection.migration_context.migrate; Dir["test/**/*_test.rb"].sort.each { |f| require File.expand_path(f) }')
          done

  java:
    name: Java (Maven) ${{ matrix.db_driver }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - db_driver: sqlite
            db_host: ""
            db_port: ""
            db_user: ""
            db_pass: ""
            db_file: ""
            services: {}
          - db_driver: pgsql
            db_host: 127.0.0.1
            db_port: "5432"
            db_user: postgres
            db_pass: postgres
            db_file: ""
            services:
              postgres:
                image: postgres:16
                ports: ['5432:5432']
                env:
                  POSTGRES_USER: postgres
                  POSTGRES_PASSWORD: postgres
                  POSTGRES_DB: postgres
                options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
          - db_driver: mysql
            db_host: 127.0.0.1
            db_port: "3306"
            db_user: root
            db_pass: secret
            db_file: ""
            services:
              mariadb:
                image: mariadb:11
                ports: ['3306:3306']
                env:
                  MARIADB_ROOT_PASSWORD: secret
                options: --health-cmd "mariadb-admin ping -h 127.0.0.1 -uroot -psecret --silent" --health-interval 10s --health-timeout 5s --health-retries 10
          - db_driver: sqlserver
            db_host: 127.0.0.1
            db_port: "1433"
            db_user: sa
            db_pass: 'SqlServer123!'
            db_file: ""
            services:
              sqlserver:
                image: mcr.microsoft.com/mssql/server:2022-latest
                ports: ['1433:1433']
                env:
                  ACCEPT_EULA: 'Y'
                  MSSQL_SA_PASSWORD: 'SqlServer123!'
                  MSSQL_PID: 'Developer'
                options: --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$MSSQL_SA_PASSWORD" -Q 'SELECT 1' -C -b" --health-interval 10s --health-timeout 5s --health-retries 15
    env:
      DB_DRIVER: ${{ matrix.db_driver }}
      DB_HOST: ${{ matrix.db_host }}
      DB_PORT: ${{ matrix.db_port }}
      DB_USER: ${{ matrix.db_user }}
      DB_PASSWORD: ${{ matrix.db_pass }}
      DB_FILE: ${{ matrix.db_file }}
      CACHE_TYPE: local
      # Temurin 21.0.11's C1 JIT crashes on ConcurrentHashMap::putVal (see AGENTS.md).
      JAVA_TOOL_OPTIONS: -XX:-TieredCompilation
    services: ${{ matrix.services }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install clients + create databases
        if: matrix.db_driver != 'sqlite'
        shell: bash
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client default-mysql-client
          if [ "$DB_DRIVER" = "sqlserver" ]; then
            curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | sudo gpg --dearmor -o /usr/share/keyrings/microsoft-prod.gpg
            curl -fsSL https://packages.microsoft.com/config/ubuntu/22.04/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list >/dev/null
            sudo apt-get update -qq && sudo ACCEPT_EULA=Y apt-get install -y -qq mssql-tools18
          fi
          if [ -n "$DB_HOST" ] && [ "$DB_DRIVER" = "sqlserver" ]; then
            for i in $(seq 1 30); do
              if /opt/mssql-tools18/bin/sqlcmd -S "$DB_HOST,$DB_PORT" -U "$DB_USER" -P "$DB_PASSWORD" -Q 'SELECT 1' -C -b >/dev/null 2>&1; then break; fi
              echo "waiting for sqlserver at $DB_HOST..."; sleep 2
            done
          fi
          for db in contacts inboxes passwords tasks; do
            case "$DB_DRIVER" in
              pgsql)   PGPASSWORD=$DB_PASSWORD psql -h $DB_HOST -U $DB_USER -tc "SELECT 1 FROM pg_database WHERE datname='$db'" | grep -q 1 || PGPASSWORD=$DB_PASSWORD psql -h $DB_HOST -U $DB_USER -c "CREATE DATABASE $db" 2>/dev/null || true ;;
              mysql)   mysql -h $DB_HOST -u$DB_USER -p$DB_PASSWORD -e "CREATE DATABASE IF NOT EXISTS $db" 2>/dev/null || true ;;
              sqlserver) /opt/mssql-tools18/bin/sqlcmd -S "$DB_HOST,$DB_PORT" -U "$DB_USER" -P "$DB_PASSWORD" -Q "IF DB_ID('$db') IS NULL CREATE DATABASE [$db]" -C -b 2>/dev/null || true ;;
            esac
          done
      - name: Test all Java projects
        shell: bash
        run: |
          set -e
          command -v mvn >/dev/null 2>&1 || sudo apt-get install -y -qq maven
          for pom in $(find . -name pom.xml -not -path '*/target/*' | sort); do
            echo "=== $pom ==="
            mvn -q -f "$pom" test
          done
