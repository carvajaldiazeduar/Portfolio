              echo "waiting for sqlserver at $DB_HOST..."; sleep 2
            done
          fi
          for db in contacts inboxes passwords tasks; do
            case "$DB_DRIVER" in
              pgsql)   PGPASSWORD=$DB_PASSWORD psql -h $DB_HOST -U $DB_USER -tc "SELECT 1 FROM pg_database WHERE datname='$db'" | grep -q 1 || PGPASSWORD=$DB_PASSWORD psql -h $DB_HOST -U $DB_USER -c "CREATE DATABASE $db" 2>/dev/null || true ;;
              mysql)   mysql -h $DB_HOST -u$DB_USER -p$DB_PASSWORD -e "CREATE DATABASE IF NOT EXISTS $db" 2>/dev/null || true ;;
              sqlserver) /opt/mssql-tools18/bin/sqlcmd -S "$DB_HOST,$DB_PORT" -U "$DB_USER" -P "$DB_PASSWORD" -Q "IF DB_ID('$db') IS NULL CREATE DATABASE [$db]" -C -b 2>/dev/null || true ;;
            esac
          done
      - name: Test all Python projects
        shell: bash
        run: |
          set -e
          for t in $(find . -type d -name tests -path '*/Python/*' | sort); do
            d=$(dirname "$t")
            echo "=== $d ==="
            (cd "$d" && python -m pytest -q)
          done

  node:
    name: Node.js (Jest) ${{ matrix.db_driver }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - db_driver: sqlite
            db_host: ""
            db_port: ""
            db_user: ""
            db_pass: ""
            db_file: /tmp/contacts.db
            services: {}
          - db_driver: pgsql
            db_host: 127.0.0.1
            db_port: "5432"
            db_user: postgres
            db_pass: postgres
            db_file: ""
            services:
              postgres:
                image: postgres:16
                ports: ['5432:5432']
                env:
                  POSTGRES_USER: postgres
                  POSTGRES_PASSWORD: postgres
                  POSTGRES_DB: postgres
                options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
          - db_driver: mysql
            db_host: 127.0.0.1
            db_port: "3306"
            db_user: root
            db_pass: secret
            db_file: ""
            services:
              mariadb:
                image: mariadb:11
                ports: ['3306:3306']
                env:
                  MARIADB_ROOT_PASSWORD: secret
                options: --health-cmd "mariadb-admin ping -h 127.0.0.1 -uroot -psecret --silent" --health-interval 10s --health-timeout 5s --health-retries 10
          - db_driver: mongodb
            db_host: 127.0.0.1
            db_port: "27017"
            db_user: ""
            db_pass: ""
            db_file: ""
            services:
              mongo:
                image: mongo:7
                ports: ['27017:27017']
                options: --health-cmd "mongosh --eval '1'" --health-interval 10s --health-timeout 5s --health-retries 30
          - db_driver: sqlserver
            db_host: 127.0.0.1
            db_port: "1433"
            db_user: sa
            db_pass: 'SqlServer123!'
            db_file: ""
            services:
              sqlserver:
                image: mcr.microsoft.com/mssql/server:2022-latest
                ports: ['1433:1433']
                env:
                  ACCEPT_EULA: 'Y'
                  MSSQL_SA_PASSWORD: 'SqlServer123!'
                  MSSQL_PID: 'Developer'
                options: --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$MSSQL_SA_PASSWORD" -Q 'SELECT 1' -C -b" --health-interval 10s --health-timeout 5s --health-retries 15
    env:
      DB_DRIVER: ${{ matrix.db_driver }}
      DB_HOST: ${{ matrix.db_host }}
      DB_PORT: ${{ matrix.db_port }}
      DB_USER: ${{ matrix.db_user }}
      DB_PASSWORD: ${{ matrix.db_pass }}
      DB_FILE: ${{ matrix.db_file }}
      CACHE_TYPE: local
    services: ${{ matrix.services }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install clients + create databases
        if: matrix.db_driver != 'sqlite'
        shell: bash
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client default-mysql-client
          if [ "$DB_DRIVER" = "sqlserver" ]; then
            curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | sudo gpg --dearmor -o /usr/share/keyrings/microsoft-prod.gpg
            curl -fsSL https://packages.microsoft.com/config/ubuntu/22.04/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list >/dev/null
            sudo apt-get update -qq && sudo ACCEPT_EULA=Y apt-get install -y -qq mssql-tools18
          fi
          # Wait for the database service to accept connections (avoids races with
          # Prisma `db push` / first test connections right after service start).
          if [ -n "$DB_HOST" ] && [ "$DB_DRIVER" = "pgsql" ]; then
            for i in $(seq 1 30); do
              if PGPASSWORD=$DB_PASSWORD psql -h "$DB_HOST" -U "$DB_USER" -c '\q' >/dev/null 2>&1; then break; fi
              echo "waiting for postgres at $DB_HOST..."; sleep 2
            done
          fi
          if [ -n "$DB_HOST" ] && [ "$DB_DRIVER" = "mysql" ]; then
            for i in $(seq 1 30); do
              if mysql -h "$DB_HOST" -u"$DB_USER" -p"$DB_PASSWORD" -e 'SELECT 1' >/dev/null 2>&1; then break; fi
              echo "waiting for mysql at $DB_HOST..."; sleep 2
            done
          fi
          if [ -n "$DB_HOST" ] && [ "$DB_DRIVER" = "sqlserver" ]; then
            for i in $(seq 1 30); do
              if /opt/mssql-tools18/bin/sqlcmd -S "$DB_HOST,$DB_PORT" -U "$DB_USER" -P "$DB_PASSWORD" -Q 'SELECT 1' -C -b >/dev/null 2>&1; then break; fi
              echo "waiting for sqlserver at $DB_HOST..."; sleep 2
            done
          fi
          for db in contacts inboxes passwords tasks; do
            case "$DB_DRIVER" in
              pgsql)   PGPASSWORD=$DB_PASSWORD psql -h $DB_HOST -U $DB_USER -tc "SELECT 1 FROM pg_database WHERE datname='$db'" | grep -q 1 || PGPASSWORD=$DB_PASSWORD psql -h $DB_HOST -U $DB_USER -c "CREATE DATABASE $db" 2>/dev/null || true ;;
              mysql)   mysql -h $DB_HOST -u$DB_USER -p$DB_PASSWORD -e "CREATE DATABASE IF NOT EXISTS $db" 2>/dev/null || true ;;
              sqlserver) /opt/mssql-tools18/bin/sqlcmd -S "$DB_HOST,$DB_PORT" -U "$DB_USER" -P "$DB_PASSWORD" -Q "IF DB_ID('$db') IS NULL CREATE DATABASE [$db]" -C -b 2>/dev/null || true ;;
            esac
          done
      - name: Test all Node.js projects
        shell: bash
        run: |
          set -e
          for pkg in $(find . -name package.json -path '*/Node.js/*' -not -path '*/node_modules/*' | sort); do
            d=$(dirname "$pkg")
            [ -d "$d/tests" ] || continue
            echo "=== $d ==="
            (cd "$d" && npm install --no-fund --no-audit)
            # Prisma projects are pinned to a single datasource provider in schema.prisma;
            # only run them against the matching driver, otherwise skip.
            skip=0
            if [ -d "$d/prisma" ] && [ -f "$d/prisma/schema.prisma" ]; then
              prov=$(awk '/^datasource[[:space:]]/{f=1} f&&/provider[[:space:]]*=/{sub(/.*= */,""); gsub(/"/,""); print; exit}' "$d/prisma/schema.prisma")
              cur="$DB_DRIVER"
              want=$(case "$prov" in postgresql|postgres) echo pgsql;; mysql) echo mysql;; sqlite|sqlite3) echo sqlite;; sqlserver|mssql) echo sqlserver;; mongodb) echo mongodb;; esac)
              [ -n "$want" ] && [ "$cur" != "$want" ] && skip=1
            fi
            if [ "$skip" = 1 ]; then
              echo "=== $d (skipped: prisma provider=$prov, driver=$cur) ==="
              continue
            fi
            if [ -d "$d/prisma" ]; then
              db=$(sed -n "s/.*DB_NAME.*|| '\([^']*\)'.*/\1/p" "$d/server.js")
              url="postgresql://$DB_USER:$DB_PASSWORD@$DB_HOST:$DB_PORT/$db"
              if [ "$DB_DRIVER" = "pgsql" ]; then
                PGPASSWORD=$DB_PASSWORD psql -h $DB_HOST -U $DB_USER -tc "SELECT 1 FROM pg_database WHERE datname='$db'" | grep -q 1 || PGPASSWORD=$DB_PASSWORD psql -h $DB_HOST -U $DB_USER -c "CREATE DATABASE \"$db\""
                (cd "$d" && DATABASE_URL="$url" npx prisma generate)
                pushed=0
                for i in $(seq 1 40); do
                  if (cd "$d" && DATABASE_URL="$url" npx prisma db push --accept-data-loss --skip-generate) >/dev/null 2>&1; then
                    pushed=1; break
                  fi
                  echo "prisma db push attempt $i failed, retrying in 5s..."; sleep 5
                done
                [ "$pushed" = 1 ] || { echo "prisma db push failed after retries"; exit 1; }
                (cd "$d" && DATABASE_URL="$url" npx jest --ci --runInBand --forceExit)
              else
                echo "=== $d (skipped: prisma provider=$prov, driver=$cur) ==="
                continue
              fi
            else
              out=$(cd "$d" && npx jest --ci --runInBand --forceExit 2>&1) && rc=0 || rc=$?
              if [ $rc -ne 0 ] && echo "$out" | grep -qiE "Unsupported database driver|must start with the protocol|Invalid datasource"; then
                echo "=== $d (skipped: driver unsupported by project) ==="
              else
                printf '%s\n' "$out"
                [ $rc -ne 0 ] && exit 1
              fi
            fi
            # Free disk space so the database service container stays healthy
            # across the many sequential `npm install` runs in this job.
            rm -rf "$d/node_modules" 2>/dev/null || true
          done

  php:
    name: PHP (lint + assert) ${{ matrix.db_driver }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - db_driver: sqlite
            db_host: ""
            db_port: ""
            db_user: ""
            db_pass: ""
            db_file: ""
            services: {}
