services:
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      CHAT_PROVIDER: ${CHAT_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GOOGLE_BASE_URL: ${GOOGLE_BASE_URL:-https://generativelanguage.googleapis.com}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-https://api.anthropic.com}
      CHAT_MODEL: ${CHAT_MODEL:-gpt-4o-mini}
      CHAT_TEMPERATURE: ${CHAT_TEMPERATURE:-0.7}
      CHAT_MAX_TOKENS: ${CHAT_MAX_TOKENS:-1024}
      CHAT_TIMEOUT_MS: ${CHAT_TIMEOUT_MS:-30000}
      CHAT_FALLBACK_PROVIDER: ${CHAT_FALLBACK_PROVIDER:-}
      RAG_ENABLED: ${RAG_ENABLED:-false}
      RAG_SEARCH_URL: ${RAG_SEARCH_URL:-http://semantic-search:5000/api/search}
      RAG_TOP_K: ${RAG_TOP_K:-3}
    volumes:
      - .:/app

  # ─── SemanticSearch (optional, for RAG) ─────────────────────────
